name: Portable Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: false
        default: 0.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux .deb and .rpm
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build portable executable
        run: |
          swift --version
          swift build -c release --product PasteGlidePortable
          mkdir -p dist/linux
          cp .build/release/PasteGlidePortable dist/linux/PasteGlide
          chmod +x dist/linux/PasteGlide

      - name: Install nfpm
        run: |
          apt-get update
          apt-get install -y curl
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' > /etc/apt/sources.list.d/goreleaser.list
          apt-get update
          apt-get install -y nfpm

      - name: Package Linux artifacts
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-0.0.0}"
          VERSION="$VERSION" ./scripts/build_linux_packages.sh dist/linux/PasteGlide

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pasteglide-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  windows:
    name: Windows .msi and .zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          update-sdk-modules: true

      - name: Build portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          swift --version
          swift build -c release --product PasteGlidePortable
          if ($LASTEXITCODE -ne 0) {
            throw "swift build failed with exit code $LASTEXITCODE"
          }
          $binPath = swift build -c release --product PasteGlidePortable --show-bin-path
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($binPath)) {
            throw "SwiftPM did not return a release binary path."
          }
          Write-Host "SwiftPM bin path: $binPath"
          New-Item -ItemType Directory -Force -Path dist/windows/PasteGlide | Out-Null
          $portableExe = Get-ChildItem $binPath -Recurse -File |
            Where-Object { $_.Name -eq "PasteGlidePortable.exe" -or $_.Name -eq "PasteGlidePortable" } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $portableExe) {
            Get-ChildItem $binPath -Recurse -File |
              Where-Object { $_.Name -like "*PasteGlidePortable*" } |
              Select-Object -ExpandProperty FullName
            throw "PasteGlidePortable.exe was not found after build."
          }
          Copy-Item $portableExe.FullName dist/windows/PasteGlide/PasteGlide.exe
          Copy-Item "$env:SDKROOT\usr\bin\*.dll" dist/windows/PasteGlide -ErrorAction SilentlyContinue
          Copy-Item "$env:SDKROOT\usr\lib\swift\windows\*.dll" dist/windows/PasteGlide -ErrorAction SilentlyContinue

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $version.TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.0.0"
          }
          ./scripts/build_windows_packages.ps1 -AppDir dist/windows/PasteGlide -Version $version

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pasteglide-windows-packages
          path: |
            dist/*.msi
            dist/*.zip

  release:
    name: Attach portable packages to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: pasteglide-linux-packages
          path: dist/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: pasteglide-windows-packages
          path: dist/release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          FR
          - Ajoute les paquets portables Linux et Windows generes automatiquement.
          - Linux: .deb et .rpm.
          - Windows: .msi et .zip.
          - Ces paquets valident la chaine multiplateforme portable; l'application graphique native Linux/Windows reste a porter.

          EN
          - Adds automatically generated portable Linux and Windows packages.
          - Linux: .deb and .rpm.
          - Windows: .msi and .zip.
          - These packages validate the portable cross-platform chain; the native Linux/Windows graphical app still needs to be ported.
          NOTES

          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" --title "PasteGlide" --notes-file release-notes.md
          fi

          gh release upload "${TAG_NAME}" dist/release/* --clobber
