name: Portable Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: false
        default: 0.0.0
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Linux .deb and .rpm
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build portable executable
        run: |
          swift --version
          swift build -c release --product PasteGlidePortable
          mkdir -p dist/linux
          cp .build/release/PasteGlidePortable dist/linux/PasteGlide
          chmod +x dist/linux/PasteGlide

      - name: Install nfpm
        run: |
          apt-get update
          apt-get install -y curl
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' > /etc/apt/sources.list.d/goreleaser.list
          apt-get update
          apt-get install -y nfpm

      - name: Package Linux artifacts
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION:-0.0.0}"
          VERSION="$VERSION" ./scripts/build_linux_packages.sh dist/linux/PasteGlide

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pasteglide-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  windows:
    name: Windows .msi and .zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Swift
        shell: pwsh
        run: |
          winget install --id Swift.Toolchain -e --source winget --accept-package-agreements --accept-source-agreements
          $swiftSearchRoots = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "$env:ProgramFiles\Swift",
            "${env:ProgramFiles(x86)}\Swift"
          )
          $swift = Get-ChildItem $swiftSearchRoots -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $swift) {
            throw "Swift executable was not found after installation."
          }
          $swiftUsr = Resolve-Path (Join-Path $swift.DirectoryName "..")
          $swiftLib = Join-Path $swiftUsr "lib\swift"
          $swiftRoot = Resolve-Path (Join-Path $swift.DirectoryName "..\..\..")
          $swiftPaths = @($swift.DirectoryName)
          $swiftPaths += Get-ChildItem $swiftRoot -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique
          $swiftPaths | Sort-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SWIFT_USR=$($swiftUsr.Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWIFT_LIB=$swiftLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          swift --version
          New-Item -ItemType Directory -Force -Path dist/windows/PasteGlide | Out-Null
          $sourceFiles = @(
            Get-ChildItem Sources/PasteGlideShared -Filter *.swift | Sort-Object FullName | ForEach-Object { $_.FullName }
          )
          $sourceFiles += (Resolve-Path Sources/PasteGlidePortable/main.swift).Path
          swiftc `
            -I "$env:SWIFT_LIB" `
            -L "$env:SWIFT_LIB\windows" `
            @sourceFiles `
            -o dist/windows/PasteGlide/PasteGlide.exe
          if ($LASTEXITCODE -ne 0) {
            throw "swiftc failed with exit code $LASTEXITCODE"
          }
          Copy-Item "$env:SWIFT_USR\bin\*.dll" dist/windows/PasteGlide -ErrorAction SilentlyContinue
          Copy-Item "$env:SWIFT_LIB\windows\*.dll" dist/windows/PasteGlide -ErrorAction SilentlyContinue

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $version.TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "0.0.0"
          }
          ./scripts/build_windows_packages.ps1 -AppDir dist/windows/PasteGlide -Version $version

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pasteglide-windows-packages
          path: |
            dist/*.msi
            dist/*.zip
